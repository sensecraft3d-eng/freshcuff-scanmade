name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run tests (fast set)
        run: python -m pytest -m "not slow" -ra

      - name: Run tests (slow set, full sample-hand pipeline)
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -m "slow" -ra

      - name: Check the offline launcher starts (syntax only)
        run: python -m py_compile launchers/start_local.py

  browser-e2e:
    name: Browser end-to-end (Chromium, sample hand)
    runs-on: ubuntu-24.04   # Playwright 1.56 has no browser build for newer Ubuntu images
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Required end-to-end files must exist
        shell: bash
        run: |
          for f in tests/e2e/run_sample.mjs tests/e2e/run_fixes.mjs tests/e2e/run_tape_real.mjs tests/e2e/run_states.mjs tests/e2e/mock/mock_worker.js tools/build_manifest.py tools/serve.py; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        shell: bash
        run: |
          if [ -f tests/e2e/package.json ]; then
            (cd tests/e2e && if [ -f package-lock.json ]; then npm ci; else npm install; fi)
          else
            npm install --no-save --no-package-lock playwright@1.56.0
          fi
          npx playwright install --with-deps chromium

      - name: Check the integrity manifest is up to date
        run: python tools/build_manifest.py --check

      - name: Start local server
        shell: bash
        run: |
          nohup python tools/serve.py --port 8765 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ > /dev/null

      - name: Run the sample hand in Chromium
        env:
          FRESHCUFF_URL: http://127.0.0.1:8765/
        run: node tests/e2e/run_sample.mjs

      - name: Run the orientation-fix and knuckle-click test in Chromium
        env:
          FRESHCUFF_URL: http://127.0.0.1:8765/
        run: node tests/e2e/run_fixes.mjs

      - name: Run the tape-gate test (scan loaded as a user file) in Chromium
        env:
          FRESHCUFF_URL: http://127.0.0.1:8765/
        run: node tests/e2e/run_tape_real.mjs

      - name: Run the page-state and keyboard tests in Chromium (mock data)
        run: node tests/e2e/run_states.mjs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            tests/e2e/out/
            server.log
          if-no-files-found: ignore
          retention-days: 14

  cad-build:
    name: CAD rebuild (OpenCascade, size 4 and grid geometry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CAD dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements-cad.txt
      - name: Rebuild and compare
        run: python -m pytest tests/cad -ra
